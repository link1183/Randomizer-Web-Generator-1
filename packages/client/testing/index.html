<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>testing</title>
    <link href="index.css" rel="stylesheet" />
  </head>
  <body>
    <button id="update">Hi mom</button>
    <div class="select" id="select-test">
      <div class="selected" data-value="">Select an option</div>
      <div class="options">
        <div
          class="option"
          data-value="0"
          data-tooltip-text="This is a tooltip&#0010;&#0010;&#0010;with multiple lines in it"
        >
          First option
        </div>
        <div
          class="option"
          data-value="1"
          data-tooltip-text="This option is disabled and is thus not possible to select"
          data-disabled="true"
        >
          2nd option
        </div>
        <div class="option" data-value="2" data-tooltip-text="another option">
          idk, something i guess
        </div>
        <div
          class="option"
          data-value="3"
          data-tooltip-text="Yep, idk what text to put anymore"
        >
          jfds
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
